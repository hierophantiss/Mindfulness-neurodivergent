<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Δοκιμή δικής μας φωνής (Piper)</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: system-ui, sans-serif; background:#0f1a17; color:#e6efe9; margin:0; padding:20px; line-height:1.5; }
  .wrap { max-width:640px; margin:0 auto; }
  h1 { font-size:1.25rem; } p.note { color:#9fb3a9; font-size:.9rem; }
  textarea { width:100%; box-sizing:border-box; min-height:110px; border-radius:12px; border:1px solid #2c3b35; background:#132420; color:#e6efe9; padding:12px; font-size:1rem; }
  label { display:block; margin:14px 0 6px; font-size:.9rem; color:#9fb3a9; }
  select { width:100%; background:#132420; color:#e6efe9; border:1px solid #2c3b35; border-radius:10px; padding:12px; font-size:1rem; }
  .row { display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; }
  button { border:none; cursor:pointer; font-weight:600; border-radius:10px; padding:12px 14px; font-size:1rem; }
  button.primary { background:#10b981; color:#04110c; flex:1; } button.ghost { background:#1c2e28; color:#e6efe9; }
  button:disabled { opacity:.5; }
  #status { margin-top:16px; padding:12px; border-radius:12px; background:#132420; border:1px solid #2c3b35; font-size:.92rem; white-space:pre-wrap; }
  .bar { height:8px; background:#1c2e28; border-radius:6px; overflow:hidden; margin-top:8px; } .bar>i { display:block; height:100%; width:0; background:#10b981; transition:width .2s; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🔊 Δοκιμή δικής μας φωνής</h1>
  <p class="note">Τοπική νευρωνική φωνή (Piper), τρέχει εξ ολοκλήρου στη συσκευή. Πρώτη χρήση: κατεβάζει το μοντέλο (~63MB ελληνικά)· μετά offline.</p>

  <label for="txt">Κείμενο</label>
  <textarea id="txt">Κάθισε για λίγο. Νιώσε το βάρος του σώματός σου να ακουμπά στο έδαφος. Η αναπνοή έρχεται και φεύγει μόνη της — δεν χρειάζεται να κάνεις τίποτα. Απλώς είσαι εδώ, παρών, ζωντανός.</textarea>

  <label for="voice">Φωνή</label>
  <select id="voice">
    <option value="el_GR-rapunzelina-low" selected>Ελληνικά — rapunzelina (low, ~63MB)</option>
    <option value="en_US-hfc_female-medium">English US — hfc_female (medium)</option>
    <option value="en_US-amy-low">English US — amy (low)</option>
    <option value="en_GB-alan-low">English GB — alan (low)</option>
  </select>

  <div class="row">
    <button id="play" class="primary" disabled>Κατέβασε &amp; Άκου</button>
    <button id="stop" class="ghost">■ Διακοπή</button>
  </div>
  <div id="status">Φόρτωση βιβλιοθήκης…</div>
  <div class="bar"><i id="prog"></i></div>
</div>

<script type="module">
  // ── ΔΙΟΡΘΩΣΗ: η βιβλιοθήκη ζητά μοντέλα από το άδειο "diffusionstudio/piper-voices".
  //    Ανακατευθύνουμε στο ζωντανό "rhasspy/piper-voices" (ίδια δομή φακέλων).
  const _fetch = window.fetch.bind(window);
  window.fetch = (input, init) => {
    try {
      let url = typeof input === 'string' ? input : (input && input.url);
      if (url && url.includes('diffusionstudio/piper-voices')) {
        const fixed = url.replace('diffusionstudio/piper-voices', 'rhasspy/piper-voices');
        return _fetch(fixed, init);
      }
    } catch (_) {}
    return _fetch(input, init);
  };

  const $ = (id) => document.getElementById(id);
  const status = (m) => { $('status').textContent = m; };
  const setProg = (p) => { $('prog').style.width = Math.max(0, Math.min(100, p)) + '%'; };

  let tts = null, currentAudio = null;

  async function loadLib() {
    try { tts = await import('https://esm.sh/@diffusionstudio/vits-web@1.0.3'); }
    catch (e1) {
      status('esm.sh απέτυχε, δοκιμή jsDelivr…');
      tts = await import('https://cdn.jsdelivr.net/npm/@diffusionstudio/vits-web@1.0.3/+esm');
    }
  }

  async function speak(voiceId, text) {
    stop();
    try {
      const stored = await tts.stored().catch(() => []);
      if (!stored.includes(voiceId)) {
        status('Κατέβασμα μοντέλου (' + voiceId + ')… μία φορά, μετά offline.');
        await tts.download(voiceId, (p) => setProg(Math.round(p.loaded * 100 / (p.total || 1))));
      }
      setProg(100);
      status('Παραγωγή φωνής τοπικά στη συσκευή σου…');
      const wav = await tts.predict({ text, voiceId });
      const audio = new Audio(URL.createObjectURL(wav));
      currentAudio = audio;
      audio.onended = () => status('Τέλος. Πώς σου φάνηκε η φωνή;');
      await audio.play();
      status('▶ Ακούγεται… (' + voiceId + ')');
    } catch (e) {
      status('Σφάλμα: ' + (e && e.message ? e.message : e));
    }
  }
  function stop() { if (currentAudio) { try { currentAudio.pause(); } catch(_){} currentAudio = null; } }

  $('play').onclick = () => speak($('voice').value, $('txt').value.trim());
  $('stop').onclick = stop;

  (async () => {
    try { await loadLib(); $('play').disabled = false; status('Έτοιμο. Πάτα «Κατέβασε & Άκου».'); }
    catch (e) { status('Αποτυχία φόρτωσης βιβλιοθήκης: ' + (e && e.message ? e.message : e)); }
  })();
</script>
</body>
</html>
