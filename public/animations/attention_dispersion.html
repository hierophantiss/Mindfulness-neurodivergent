<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attention Dispersion</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #05080a;
            color: #bde0cf;
            font-family: 'Inter', system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        canvas {
            display: block;
        }
        .controls {
            position: absolute;
            bottom: 40px;
            width: 100%;
            text-align: center;
        }
        .caption {
            background: rgba(0, 0, 0, 0.7);
            padding: 12px 24px;
            border-radius: 20px;
            font-size: 14px;
            backdrop-blur: 10px;
            border: 1px solid rgba(255, 100, 100, 0.3);
            max-width: 80%;
            display: inline-block;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="controls">
        <div class="caption" id="caption">Διασπορά vs Συγκέντρωση. Κάντε κλικ για επαναφορά.</div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const caption = document.getElementById('caption');

        let width, height, cx, cy;
        let particles = [];
        let gathering = false;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * window.devicePixelRatio;
            canvas.height = height * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            cx = width / 2;
            cy = height / 2;
            initParticles();
        }

        function initParticles() {
            particles = [];
            for(let i=0; i<100; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    vx: (Math.random() - 0.5) * 2,
                    vy: (Math.random() - 0.5) * 2,
                    size: 2 + Math.random() * 4
                });
            }
        }

        window.addEventListener('resize', resize);
        window.addEventListener('mousedown', () => gathering = true);
        window.addEventListener('mouseup', () => gathering = false);
        window.addEventListener('touchstart', () => gathering = true);
        window.addEventListener('touchend', () => gathering = false);
        
        resize();

        const lang = window.location.search.includes('lang=en') ? 'en' : 'el';
        const strings = {
            el: "Διασπορά: Η προσοχή φεύγει. Κρατήστε πατημένο για συγκέντρωση.",
            en: "Dispersion: Attention drifts. Hold to concentrate."
        };
        caption.innerText = strings[lang];

        function animate() {
            ctx.fillStyle = '#05080a';
            ctx.fillRect(0, 0, width, height);

            particles.forEach(p => {
                if (gathering) {
                    const dx = cx - p.x;
                    const dy = cy - p.y;
                    p.vx += dx * 0.005;
                    p.vy += dy * 0.005;
                    p.vx *= 0.92;
                    p.vy *= 0.92;
                } else {
                    p.vx += (Math.random() - 0.5) * 0.1;
                    p.vy += (Math.random() - 0.5) * 0.1;
                    p.vx *= 0.99;
                    p.vy *= 0.99;
                }

                p.x += p.vx;
                p.y += p.vy;

                // Bounce
                if(p.x < 0 || p.x > width) p.vx *= -1;
                if(p.y < 0 || p.y > height) p.vy *= -1;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = gathering ? '#7fc1a3' : '#ff6464';
                ctx.fill();
            });

            if (gathering) {
                ctx.beginPath();
                ctx.arc(cx, cy, 50, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(127, 193, 163, 0.3)';
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
