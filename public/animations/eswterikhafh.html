<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inner Touch - Regulation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #05080a;
            color: #bde0cf;
            font-family: 'Inter', system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        canvas {
            display: block;
        }
        .controls {
            position: absolute;
            bottom: 40px;
            width: 100%;
            text-align: center;
        }
        .caption {
            background: rgba(0, 0, 0, 0.7);
            padding: 12px 24px;
            border-radius: 20px;
            font-size: 14px;
            backdrop-blur: 10px;
            border: 1px solid rgba(110, 211, 236, 0.3);
            max-width: 80%;
            display: inline-block;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="controls">
        <div class="caption" id="caption">Αναπνοή και Ρύθμιση. Νιώστε την εσωτερική κίνηση.</div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const caption = document.getElementById('caption');

        let width, height;
        let time = 0;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * window.devicePixelRatio;
            canvas.height = height * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }

        window.addEventListener('resize', resize);
        resize();

        const strings = {
            el: "Εσωτερική Αφή: Ο παλμός της ζωής μέσα σας.",
            en: "Inner Touch: The pulse of life within you."
        };

        const lang = window.location.search.includes('lang=en') ? 'en' : 'el';
        caption.innerText = strings[lang];

        const waves = [];
        for(let i=0; i<5; i++) {
            waves.push({ r: i * 50, a: 1 - i * 0.2 });
        }

        function animate() {
            ctx.fillStyle = '#05080a';
            ctx.fillRect(0, 0, width, height);

            time += 0.015;
            const pulse = (Math.sin(time) + 1) / 2;

            const cx = width / 2;
            const cy = height / 2;

            // Draw center organism
            const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 100 + pulse * 50);
            grad.addColorStop(0, `rgba(110, 211, 236, ${0.4 + pulse * 0.3})`);
            grad.addColorStop(1, 'transparent');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(cx, cy, 150 + pulse * 50, 0, Math.PI * 2);
            ctx.fill();

            // Expanding waves
            for(let w of waves) {
                w.r += 1 + pulse * 2;
                if(w.r > 300) {
                    w.r = 0;
                    w.a = 1;
                }
                w.a -= 0.005;
                
                ctx.beginPath();
                ctx.arc(cx, cy, w.r, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(189, 224, 207, ${Math.max(0, w.a * 0.4)})`;
                ctx.lineWidth = 1;
                ctx.stroke();
            }

            // Central core
            ctx.beginPath();
            ctx.arc(cx, cy, 40 + pulse * 10, 0, Math.PI * 2);
            ctx.fillStyle = '#bde0cf';
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#6ed3ec';
            ctx.fill();
            ctx.shadowBlur = 0;

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
