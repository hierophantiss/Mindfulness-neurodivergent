<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Racing Mind</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #05080a;
            color: #bde0cf;
            font-family: 'Inter', system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        canvas {
            display: block;
        }
        .controls {
            position: absolute;
            bottom: 40px;
            width: 100%;
            text-align: center;
        }
        .caption {
            background: rgba(0, 0, 0, 0.7);
            padding: 12px 24px;
            border-radius: 20px;
            font-size: 14px;
            backdrop-blur: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 80%;
            display: inline-block;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="controls">
        <div class="caption" id="caption">Racing Mind: Η ταχύτητα του νου. Παρατηρήστε χωρίς να πιαστείτε.</div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const caption = document.getElementById('caption');

        let width, height;
        let lines = [];

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * window.devicePixelRatio;
            canvas.height = height * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            initLines();
        }

        function initLines() {
            lines = [];
            for(let i=0; i<30; i++) {
                lines.push({
                    y: Math.random() * height,
                    x: Math.random() * width,
                    speed: 5 + Math.random() * 15,
                    length: 50 + Math.random() * 200,
                    opacity: 0.1 + Math.random() * 0.4
                });
            }
        }

        window.addEventListener('resize', resize);
        resize();

        const lang = window.location.search.includes('lang=en') ? 'en' : 'el';
        const strings = {
            el: "Racing Mind: Οι σκέψεις τρέχουν. Εσείς είστε ο παρατηρητής.",
            en: "Racing Mind: Thoughts are racing. You are the observer."
        };
        caption.innerText = strings[lang];

        function animate() {
            ctx.fillStyle = 'rgba(5, 8, 10, 0.2)';
            ctx.fillRect(0, 0, width, height);

            lines.forEach(l => {
                l.x += l.speed;
                if(l.x > width) {
                    l.x = -l.length;
                    l.y = Math.random() * height;
                }

                ctx.beginPath();
                ctx.moveTo(l.x, l.y);
                ctx.lineTo(l.x + l.length, l.y);
                ctx.strokeStyle = `rgba(255, 255, 255, ${l.opacity})`;
                ctx.lineWidth = 1;
                ctx.stroke();
            });

            // Neutral center
            ctx.beginPath();
            ctx.arc(width/2, height/2, 60, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(127, 193, 163, 0.1)';
            ctx.fill();
            ctx.strokeStyle = 'rgba(127, 193, 163, 0.5)';
            ctx.stroke();

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
