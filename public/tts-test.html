<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Δοκιμή δικής μας φωνής (Piper)</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: system-ui, -apple-system, sans-serif; background:#0f1a17; color:#e6efe9;
         margin:0; padding:20px; line-height:1.5; }
  .wrap { max-width:640px; margin:0 auto; }
  h1 { font-size:1.25rem; }
  p.note { color:#9fb3a9; font-size:.9rem; }
  textarea { width:100%; box-sizing:border-box; min-height:120px; border-radius:12px;
             border:1px solid #2c3b35; background:#132420; color:#e6efe9; padding:12px; font-size:1rem; }
  label { display:block; margin:14px 0 6px; font-size:.9rem; color:#9fb3a9; }
  select, button { font-size:1rem; border-radius:10px; padding:12px 14px; }
  select { width:100%; background:#132420; color:#e6efe9; border:1px solid #2c3b35; }
  .row { display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; }
  button { border:none; cursor:pointer; font-weight:600; }
  button.primary { background:#10b981; color:#04110c; flex:1; }
  button.ghost { background:#1c2e28; color:#e6efe9; }
  button:disabled { opacity:.5; }
  #status { margin-top:16px; padding:12px; border-radius:12px; background:#132420; border:1px solid #2c3b35;
            font-size:.92rem; white-space:pre-wrap; }
  .bar { height:8px; background:#1c2e28; border-radius:6px; overflow:hidden; margin-top:8px; }
  .bar > i { display:block; height:100%; width:0; background:#10b981; transition:width .2s; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🔊 Δοκιμή δικής μας φωνής</h1>
  <p class="note">Τοπική νευρωνική φωνή (Piper), τρέχει εξ ολοκλήρου στη συσκευή σου. Η πρώτη χρήση κατεβάζει το μοντέλο (~20–60MB ανάλογα με τη φωνή)· μετά δουλεύει offline.</p>

  <label for="txt">Κείμενο προς εκφώνηση</label>
  <textarea id="txt">Κάθισε για λίγο. Νιώσε το βάρος του σώματός σου να ακουμπά στο έδαφος. Η αναπνοή έρχεται και φεύγει μόνη της — δεν χρειάζεται να κάνεις τίποτα. Απλώς είσαι εδώ, παρών, ζωντανός.</textarea>

  <label for="voice">Φωνή</label>
  <select id="voice"><option>Φόρτωση λίστας φωνών…</option></select>

  <div class="row">
    <button id="play" class="primary" disabled>Κατέβασε &amp; Άκου</button>
    <button id="stop" class="ghost">■ Διακοπή</button>
    <button id="en" class="ghost">Δοκιμή Αγγλικών</button>
  </div>

  <div id="status">Αρχικοποίηση…</div>
  <div class="bar"><i id="prog"></i></div>
</div>

<script type="module">
  const $ = (id) => document.getElementById(id);
  const status = (m) => { $('status').textContent = m; };
  const setProg = (p) => { $('prog').style.width = Math.max(0, Math.min(100, p)) + '%'; };

  let tts = null;
  let currentAudio = null;

  async function loadLib() {
    status('Φόρτωση βιβλιοθήκης (Piper / vits-web)…');
    try {
      tts = await import('https://esm.sh/@diffusionstudio/vits-web@1.0.3');
    } catch (e1) {
      status('esm.sh απέτυχε, δοκιμή jsDelivr…');
      tts = await import('https://cdn.jsdelivr.net/npm/@diffusionstudio/vits-web@1.0.3/+esm');
    }
    return tts;
  }

  async function populateVoices() {
    try {
      const all = await tts.voices();
      const list = Object.keys(all).filter(k => /^(el|en)_/.test(k))
        .sort((a,b) => (a.startsWith('el')? -1:1));
      const sel = $('voice'); sel.innerHTML = '';
      for (const k of list) {
        const o = document.createElement('option');
        o.value = k; o.textContent = k;
        if (k.startsWith('el_GR')) o.selected = true;
        sel.appendChild(o);
      }
      if (!list.length) { const o=document.createElement('option'); o.textContent='(καμία el/en φωνή)'; sel.appendChild(o); }
      $('play').disabled = false;
      status('Έτοιμο. Διάλεξε φωνή και πάτα «Κατέβασε & Άκου».');
    } catch (e) {
      status('Σφάλμα λίστας φωνών: ' + (e && e.message ? e.message : e));
    }
  }

  async function speak(voiceId, text) {
    stop();
    try {
      const stored = await tts.stored();
      if (!stored.includes(voiceId)) {
        status('Κατέβασμα μοντέλου: ' + voiceId + ' …');
        await tts.download(voiceId, (p) => setProg(Math.round(p.loaded*100/p.total)));
      }
      setProg(100);
      status('Παραγωγή φωνής… (τοπικά, στη συσκευή σου)');
      const wav = await tts.predict({ text, voiceId });
      const audio = new Audio(URL.createObjectURL(wav));
      currentAudio = audio;
      audio.onended = () => status('Τέλος. Πώς σου φάνηκε η φωνή;');
      audio.onerror = () => status('Σφάλμα αναπαραγωγής ήχου.');
      await audio.play();
      status('▶ Ακούγεται… (φωνή: ' + voiceId + ')');
    } catch (e) {
      status('Σφάλμα: ' + (e && e.message ? e.message : e) + '\n\nΑν είναι σφάλμα δικτύου/CORS, στείλε μου το μήνυμα.');
    }
  }

  function stop() {
    if (currentAudio) { try { currentAudio.pause(); } catch(_){} currentAudio = null; }
  }

  $('play').onclick = () => speak($('voice').value, $('txt').value.trim());
  $('en').onclick   = () => speak('en_US-hfc_female-medium', 'Sit for a moment. Feel the weight of your body resting on the ground. The breath comes and goes on its own.');
  $('stop').onclick = stop;

  (async () => {
    try { await loadLib(); await populateVoices(); }
    catch (e) { status('Αποτυχία φόρτωσης βιβλιοθήκης: ' + (e && e.message ? e.message : e)); }
  })();
</script>
</body>
</html>
