# Puts the book and the audiobook on the Internet Archive (archive.org), in the
# author's account (https://archive.org/details/@hierophantis), with
# tools/internet_archive.py: four items, one per kind and language, each in its
# own language (the identifiers are in the script).
#
# Run it by hand: Actions → Internet Archive → Run workflow.
# Needs the repository secrets IA_ACCESS_KEY and IA_SECRET_KEY: the account's
# S3 keys (https://archive.org/account/s3.php).
#
# Mode:
#   list     the account's items (identifier, title, mediatype, date, files,
#            licence), to tell which ones are the first edition; and whether
#            the four identifiers are free or already the account's
#   dry-run  everything an upload would do (files, metadata, the files it
#            would remove), nothing sent; works before the keys exist
#   upload   creates or updates the items of the chosen language(s):
#            book  (texts)  public/workbook_<lang>.{pdf,epub}
#            audio (audio)  the files of the release "audiobook" for <lang>
#                           (per-chapter MP3s, the whole book as MP3 and M4B)
#            each with the book's cover as its picture
#   point-old  a note at the top of the first-edition item of each chosen
#            language, in that language, pointing to its new book and
#            audiobook; nothing else changes
#
# What an upload removes: only the other language's original files from an
# item (the two Greek items held both languages at first), by their exact
# names, with what archive.org derived from them. Nothing else. A file with
# the same name is replaced and an unchanged file (same MD5) is not sent again.

name: Internet Archive

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'list = the account''s items · dry-run = what would be done · upload · point-old = a note on the first edition'
        type: choice
        options: [list, dry-run, upload, point-old]
        default: list
      lang:
        description: The language whose items are processed
        type: choice
        options: [both, el, en]
        default: both

permissions:
  contents: read

concurrency:
  group: internet-archive
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      MODE: ${{ inputs.mode }}
      LANGS: ${{ inputs.lang == 'both' && 'el,en' || inputs.lang }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the keys
        if: inputs.mode != 'dry-run'
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: |
          if [ -z "$IA_ACCESS_KEY" ] || [ -z "$IA_SECRET_KEY" ]; then
            echo "::error::Add the repository secrets IA_ACCESS_KEY and IA_SECRET_KEY first: the keys are at https://archive.org/account/s3.php (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      # Only the languages asked for; nothing if the release does not exist.
      - name: The audiobook's files (release "audiobook")
        if: inputs.mode == 'dry-run' || inputs.mode == 'upload'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          AUDIO_DIR="$RUNNER_TEMP/audiobook"
          mkdir -p "$AUDIO_DIR"
          if ! names=$(gh api "repos/$GH_REPO/releases/tags/audiobook" --jq '.assets[].name' 2>/dev/null); then
            echo "::notice::No release \"audiobook\": only the book."
            exit 0
          fi
          langs="${LANGS//,/|}"
          wanted=$(printf '%s\n' "$names" | grep -E "^(($langs)-[0-9]{2}\.mp3|mindfulness-guide-($langs)\.(mp3|m4b))$" || true)
          if [ -z "$wanted" ]; then
            echo "::notice::The release \"audiobook\" has no files for: $LANGS"
            exit 0
          fi
          args=()
          while read -r n; do args+=(--pattern "$n"); done <<< "$wanted"
          gh release download audiobook --dir "$AUDIO_DIR" --clobber "${args[@]}"
          ls -l "$AUDIO_DIR"

      - name: Python and the archive.org library
        run: |
          python3 -m venv "$RUNNER_TEMP/ia-venv"
          "$RUNNER_TEMP/ia-venv/bin/pip" install --quiet --disable-pip-version-check "internetarchive==5.13.0"

      - name: Internet Archive (${{ inputs.mode }})
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: |
          "$RUNNER_TEMP/ia-venv/bin/python" tools/internet_archive.py "$MODE" \
            --langs="$LANGS" --audio-dir="$RUNNER_TEMP/audiobook" --summary="$GITHUB_STEP_SUMMARY"
