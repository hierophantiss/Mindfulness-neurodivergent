# Checks every change before it reaches the site: the types, the tests, a
# full build (with the sitemap and the prerendered pages), and the built site
# opened in a browser, on a phone and a computer (e2e/). Cloudflare builds
# the site on its own; this only tells us early if something is broken.

name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, so the sitemap can date each page by its last change.
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Types
        run: npx tsc --noEmit

      - name: React hooks (ESLint)
        run: npx eslint src

      - name: Tests
        run: npx vitest run

      - name: Build
        run: npm run build

      - name: The build has what the site needs
        run: |
          test -f dist/index.html
          test -f dist/sw.js
          test -f dist/404.html
          test -f dist/sitemap.xml
          pages=$(find dist/el dist/en -name '*.html' | wc -l)
          echo "prerendered pages: $pages"
          test "$pages" -ge 200
          if find dist -name '*_debug.html' | grep -q .; then echo 'debug files in the build'; exit 1; fi

      # The browser's system packages come from Ubuntu's servers; when those do
      # not answer (it happens), the runner already has what Chromium needs,
      # so the browser alone is enough.
      - name: Browser for the site checks
        run: timeout 300 npx playwright install --with-deps chromium || npx playwright install chromium

      # Every main page opens cleanly (EL/EN), the main things a person does
      # work, and accessibility (axe) on the main pages.
      - name: The site in a browser
        run: npx playwright test

      - name: Report of the site checks (if something failed)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
