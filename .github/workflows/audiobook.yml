# Builds the audio with Google Text-to-Speech (Chirp 3 HD, voice Sulafat) and
# attaches it to GitHub Releases. Nothing audio is committed to the repository.
#
# Run it by hand: Actions → Audiobook → Run workflow.
# Needs the repository secret GOOGLE_TTS_API_KEY (an API key restricted to the
# Cloud Text-to-Speech API).
#
# What:
#   app   the chapters of the app's reader: one MP3 and one timing map per
#         chapter → release "app-audio" (played in the app through /audio/…)
#   book  the audiobook of the workbook → release "audiobook"
#         (with "chapters" set: a preview → pre-release "audiobook-preview")
#   both  the two
#
# "chapters" limits the run: for the app, chapter numbers (e.g. 3 or 1-4; the
# other chapters keep their files); for the book, audio tracks (e.g. 1-3).

name: Audiobook

on:
  workflow_dispatch:
    inputs:
      target:
        description: What to build
        type: choice
        options: [app, book, both]
        default: app
      lang:
        description: Language
        type: choice
        options: [both, el, en]
        default: both
      chapters:
        description: 'Only these (app = chapter numbers, book = audio tracks), e.g. 1-3. Empty = all'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: audiobook
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      TARGET: ${{ inputs.target }}
      LANGS: ${{ inputs.lang == 'both' && 'el en' || inputs.lang }}
      ONLY: ${{ inputs.chapters }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the key
        run: |
          if [ -z "$GOOGLE_TTS_API_KEY" ]; then
            echo "::error::Add the repository secret GOOGLE_TTS_API_KEY first (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      # Spoken segments already paid for are reused, so a rerun after a small
      # change only synthesises the changed text.
      - uses: actions/cache@v4
        with:
          path: .tts-cache
          # A new key every run, so the segments spoken in this run are saved too.
          key: tts-${{ github.run_id }}
          restore-keys: tts-

      # ── App chapters ───────────────────────────────────────────────
      - uses: actions/setup-node@v4
        if: env.TARGET != 'book'
        with:
          node-version: 20
          cache: npm

      - name: App chapters
        if: env.TARGET != 'book'
        run: |
          npm ci --no-audit --no-fund
          npx tsx scripts/export-reading.ts audiobook-out/reading.json
          python3 tools/audiobook/synth_app.py audiobook-out/reading.json audiobook-out/app \
            --langs "${LANGS// /,}" --cache .tts-cache --only "$ONLY"
          gh release view app-audio >/dev/null 2>&1 || \
            gh release create app-audio --title "App chapter audio" \
              --notes "Chapter audio for the app's reader (Google Chirp 3 HD, Sulafat): one MP3 and one timing map per chapter. Served by the site at /audio/. CC BY-NC-ND 4.0."
          gh release upload app-audio audiobook-out/app/*.mp3 audiobook-out/app/*.json --clobber
          echo "App audio: https://github.com/${{ github.repository }}/releases/tag/app-audio" >> "$GITHUB_STEP_SUMMARY"

      # ── Audiobook ──────────────────────────────────────────────────
      - name: Audiobook
        if: env.TARGET != 'app'
        run: |
          for l in $LANGS; do
            python3 tools/audiobook/script.py "$l" "audiobook-out/script_$l.json"
            python3 tools/audiobook/synth.py "audiobook-out/script_$l.json" "$l" "audiobook-out/$l" \
              --cache .tts-cache --only "$ONLY"
          done
          if [ -n "$ONLY" ]; then
            tag=audiobook-preview; title="Audiobook (preview)"; extra=--prerelease
          else
            tag=audiobook; title="Audiobook"; extra=
          fi
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --title "$title" $extra \
              --notes "Audiobook of the workbook, read by a synthetic voice (Google Chirp 3 HD, Sulafat). CC BY-NC-ND 4.0."
          files=""
          for l in $LANGS; do files="$files audiobook-out/$l/*.mp3 audiobook-out/$l/*.m4b"; done
          gh release upload "$tag" $files --clobber
          echo "Audiobook: https://github.com/${{ github.repository }}/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
