# The Android app: the site's files inside an APK, so it opens and works with
# no connection and no website (capacitor.config.ts).
#
# - Every run makes an APK (as a downloadable artifact).
# - On main it also publishes the site's files as a signed bundle in the
#   release "app-bundle", where installed apps find their update
#   (src/lib/nativeUpdate.ts; job publish-update, environment app-update).
# - On main, with the upload key in the secrets, it also makes the package
#   for Google Play (AAB) in the release "play".
# - Other branches build a test copy (CAP_TEST=1) with its own id and name,
#   which installs next to the app from the store.
#
# The Android project is made fresh on every run and never kept in the
# repository (AGENTS.md: no binary files in the repo).

name: Android

on:
  push:
    branches: [main, android-app]
  workflow_dispatch:

# Read only; the jobs that publish ask for writing themselves. The build
# (npm ci, Gradle, third-party actions) never holds a token that can write.
permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      N: ${{ github.run_number }}
      VITE_BUNDLE_VERSION: ${{ github.run_number }}
      CAP_TEST: ${{ github.ref == 'refs/heads/main' && '0' || '1' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      # Gradle and the Android libraries kept between runs, so a slow or
      # failing download server (services.gradle.org, Maven Central) does
      # not stop the build. Only main writes the cache.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # The open-source cache (MIT), not the proprietary "enhanced" one.
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Install
        run: npm ci

      - name: The site's files
        run: npm run build

      # What only the website needs: the pages written out for search engines
      # (the app draws them itself), the service worker, the store pictures.
      - name: Only what the app needs
        run: rm -rf dist/el dist/en dist/screenshots dist/og-image.png dist/sitemap.xml dist/robots.txt dist/sw.js dist/workbox-*.js

      # The website's security policy comes as a header (public/_headers); the
      # app has no headers, so the same rules go into its page.
      - name: The app's security policy
        run: |
          node scripts/app-csp.mjs dist
          rm -f dist/index.html.br dist/index.html.gz
          grep -q 'http-equiv="Content-Security-Policy"' dist/index.html

      - name: The Android project
        run: |
          npx cap add android
          # No copy of the app's data in the phone's Google backup: the Journal
          # stays on the phone (src/pages/Privacy.tsx says so).
          m=android/app/src/main/AndroidManifest.xml
          sed -i -E 's/android:allowBackup="true"/android:allowBackup="false"/' "$m"
          grep -q 'android:allowBackup="false"' "$m"

      - name: Icons and splash, from the app's own icon
        run: |
          node scripts/android-assets.mjs
          npx @capacitor/assets generate --android

      - name: Version
        run: |
          f=android/app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode $N/; s/versionName \"[^\"]*\"/versionName \"1.$N\"/" "$f"
          grep -q "versionCode $N" "$f"
          # The Gradle download may be slow: a minute instead of ten seconds.
          sed -i -E 's/^networkTimeout=.*/networkTimeout=60000/' android/gradle/wrapper/gradle-wrapper.properties
          npx cap sync android

      # R8 for release builds: unused Java code and resources out, names
      # shortened (Play asks for it: "DEX code optimisation", at least 25%).
      # Capacitor's own rules keep its plugins; the updater plugin brings none,
      # so it is kept whole. Its map goes inside the AAB, so Play can still
      # read crash reports.
      - name: Shrink the release build (R8)
        run: |
          f=android/app/build.gradle
          sed -i -E "s/minifyEnabled false/minifyEnabled true\n            shrinkResources true/; s/proguard-android\.txt/proguard-android-optimize.txt/" "$f"
          grep -q "minifyEnabled true" "$f" && grep -q "shrinkResources true" "$f" && grep -q "proguard-android-optimize.txt" "$f"
          cat >> android/app/proguard-rules.pro <<'RULES'

          # The app's updates (Capgo): kept whole, it uses reflection and brings no rules.
          -keep class ee.forgr.capacitor_updater.** { *; }
          -dontwarn ee.forgr.capacitor_updater.**
          RULES
          sed -n '/buildTypes/,/^    }/p' "$f"

      # Every copy signed with the same key (the secret TEST_DEBUG_KEYSTORE, a
      # debug keystore as base64), so a new APK installs over the old one.
      # Without the secret, each run makes its own key, as before.
      - name: The same signing key every time
        env:
          KEYSTORE: ${{ secrets.TEST_DEBUG_KEYSTORE }}
        run: |
          [ -n "$KEYSTORE" ] || { echo "No TEST_DEBUG_KEYSTORE: a key of this run's own."; exit 0; }
          k="$RUNNER_TEMP/test.keystore"
          printf '%s' "$KEYSTORE" | tr -d ' \r\n' | base64 -d > "$k"
          keytool -list -v -keystore "$k" -storepass android -alias androiddebugkey | grep -m1 'SHA256:'
          echo "TEST_KEYSTORE_FILE=$k" >> "$GITHUB_ENV"

      # Gradle is told the key directly (it may not look in ~/.android). With
      # the test key, the APK is a release build, with R8 as in the Play
      # package, so the test copy shows what Play's users will get.
      - name: APK
        working-directory: android
        run: |
          gw() { for i in 1 2 3; do ./gradlew "$@" && return 0; echo "Gradle failed (try $i); again in 20 s"; sleep 20; done; return 1; }
          if [ -n "$TEST_KEYSTORE_FILE" ]; then
            gw assembleRelease --no-daemon \
              -Pandroid.injected.signing.store.file="$TEST_KEYSTORE_FILE" \
              -Pandroid.injected.signing.store.password=android \
              -Pandroid.injected.signing.key.alias=androiddebugkey \
              -Pandroid.injected.signing.key.password=android
            echo "APK_FILE=android/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"
          else
            gw assembleDebug --no-daemon
            echo "APK_FILE=android/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
          fi

      # The package for Google Play (AAB), signed with the upload key: the
      # secrets UPLOAD_KEYSTORE (the keystore as base64), UPLOAD_KEYSTORE_PASSWORD,
      # UPLOAD_KEY_ALIAS and UPLOAD_KEY_PASSWORD (if it differs from the store's).
      # Same id as the app already on Play, so it goes in as a new version of
      # it. On a branch it is only built (with the test key), as a check.
      - name: The package for Google Play (AAB)
        working-directory: android
        env:
          UPLOAD_KEYSTORE: ${{ secrets.UPLOAD_KEYSTORE }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            [ -n "$UPLOAD_KEYSTORE" ] || { echo "No UPLOAD_KEYSTORE yet: no package for Google Play."; exit 0; }
            k="$RUNNER_TEMP/upload.keystore"
            printf '%s' "$UPLOAD_KEYSTORE" | tr -d ' \r\n' | base64 -d > "$k"
            sp="$UPLOAD_KEYSTORE_PASSWORD"; ka="$UPLOAD_KEY_ALIAS"; kp="${UPLOAD_KEY_PASSWORD:-$UPLOAD_KEYSTORE_PASSWORD}"
          else
            [ -n "$TEST_KEYSTORE_FILE" ] || { echo "No test key: no check build."; exit 0; }
            k="$TEST_KEYSTORE_FILE"; sp=android; ka=androiddebugkey; kp=android
          fi
          # Which key signs it (Play knows the upload key as 77:40:B0:4E:…:89:EA).
          keytool -list -v -keystore "$k" -storepass "$sp" -alias "$ka" | grep -m1 'SHA256:'
          gw() { for i in 1 2 3; do ./gradlew "$@" && return 0; echo "Gradle failed (try $i); again in 20 s"; sleep 20; done; return 1; }
          gw bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$k" \
            -Pandroid.injected.signing.store.password="$sp" \
            -Pandroid.injected.signing.key.alias="$ka" \
            -Pandroid.injected.signing.key.password="$kp"
          f="$PWD/app/build/outputs/bundle/release/app-release.aab"
          ls -l "$f"
          unzip -l "$f" | grep -q 'base/assets/public/index.html'
          echo "AAB_FILE=$f" >> "$GITHUB_ENV"

      - name: The package for Google Play, for the job that publishes it (main only)
        if: github.ref == 'refs/heads/main' && env.AAB_FILE != ''
        run: cp "$AAB_FILE" "mindfulness-play-$N.aab"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref == 'refs/heads/main' && env.AAB_FILE != ''
        with:
          name: play-aab
          path: mindfulness-play-${{ github.run_number }}.aab
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mindfulness-android-${{ github.run_number }}
          path: ${{ env.APK_FILE }}
          retention-days: 14

      # The update for installed apps: the site's files as one zip, handed to
      # the job below, which signs and publishes it.
      - name: The update for installed apps (main only)
        if: github.ref == 'refs/heads/main'
        run: (cd dist && zip -qr "../app-bundle-$N.zip" .)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref == 'refs/heads/main'
        with:
          name: app-bundle
          path: app-bundle-${{ github.run_number }}.zip
          retention-days: 7

  # Signs the update and publishes it to the release "app-bundle". The key
  # (OTA_SIGNING_KEY) is a secret of the environment "app-update" only, so
  # only this job, on main, can sign; the environment can ask for approval
  # before it runs (Settings → Environments → app-update → Required
  # reviewers). Installed apps take an update only with a signature their own
  # key confirms (src/lib/nativeUpdate.ts). The last three bundles stay, so a
  # phone that read the manifest a moment before still finds its file.
  # The package for Google Play (main) and the test copy (branches), to the
  # releases "play" and "android-test".
  publish-builds:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      N: ${{ github.run_number }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mindfulness-android-${{ github.run_number }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: github.ref == 'refs/heads/main'
        continue-on-error: true   # no upload key yet: no package for Google Play
        with:
          name: play-aab

      - name: Publish the package for Google Play (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          [ -f "mindfulness-play-$N.aab" ] || { echo "No package for Google Play in this run."; exit 0; }
          gh release view play >/dev/null 2>&1 || gh release create play --prerelease --title "Android app: package for Google Play" --notes "The newest package (AAB) to upload in the Play Console, signed with the upload key. Made by the Android workflow from main." --latest=false
          gh release upload play "mindfulness-play-$N.aab" --clobber
          for old in $(gh release view play --json assets -q '.assets[].name' | grep -E '^mindfulness-play-[0-9]+\.aab$' | grep -v "^mindfulness-play-$N.aab$"); do
            gh release delete-asset play "$old" -y
          done

      # The test copy, to download straight onto a phone from the release page.
      - name: Publish the test APK (branches)
        if: github.ref != 'refs/heads/main'
        run: |
          cp "$(ls *.apk | head -1)" mindfulness-test.apk
          gh release view android-test >/dev/null 2>&1 || gh release create android-test --prerelease --title "Android app: test copy" --notes "A test copy of the Android app (its own id and name, next to the app from the store). Made by the Android workflow from the branch ${{ github.ref_name }}." --latest=false
          gh release upload android-test mindfulness-test.apk --clobber

  publish-update:
    needs: android
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: app-update
    permissions:
      contents: write
      actions: read
    env:
      N: ${{ github.run_number }}
    steps:
      # Phones take this copy only if the same commit passed every check
      # (the Check workflow: unit tests, build, browser checks).
      - name: Wait for the Check workflow on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 70); do
            r=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&per_page=50" -q '[.workflow_runs[] | select(.name == "Check")][0] | [.status, .conclusion] | join(" ")')
            echo "Check: ${r:-not started yet}"
            case "$r" in
              "completed success") exit 0 ;;
              completed*) echo "::error::The Check workflow did not pass: no update for the phones."; exit 1 ;;
            esac
            sleep 30
          done
          echo "::error::The Check workflow did not finish in time: no update for the phones."; exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/sign-app-bundle.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-bundle

      - name: Sign and publish the update
        env:
          GH_TOKEN: ${{ github.token }}
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: |
          sha=$(sha256sum "app-bundle-$N.zip" | cut -d' ' -f1)
          url="https://github.com/${{ github.repository }}/releases/download/app-bundle/app-bundle-$N.zip"
          node scripts/sign-app-bundle.mjs "$N" "$url" "$sha" 1 > app-bundle.json
          cat app-bundle.json
          gh release view app-bundle >/dev/null 2>&1 || gh release create app-bundle --title "Android app: update bundle" --notes "The site's files for the Android app's own updates (src/lib/nativeUpdate.ts), signed. Made by the Android workflow." --latest=false
          # The zip first, then the manifest that points to it.
          gh release upload app-bundle "app-bundle-$N.zip" --clobber
          gh release upload app-bundle app-bundle.json --clobber
          for old in $(gh release view app-bundle --json assets -q '.assets[].name' | grep -E '^app-bundle-[0-9]+\.zip$' | sed -E 's/^app-bundle-([0-9]+)\.zip$/\1/' | sort -rn | tail -n +4); do
            gh release delete-asset app-bundle "app-bundle-$old.zip" -y
          done
