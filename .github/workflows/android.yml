# The Android app: the site's files inside an APK, so it opens and works with
# no connection and no website (capacitor.config.ts).
#
# - Every run makes an APK (as a downloadable artifact).
# - On main it also publishes the site's files as a bundle in the release
#   "app-bundle", where installed apps find their update (src/lib/nativeUpdate.ts).
# - On main, with the upload key in the secrets, it also makes the package
#   for Google Play (AAB) in the release "play".
# - Other branches build a test copy (CAP_TEST=1) with its own id and name,
#   which installs next to the app from the store.
#
# The Android project is made fresh on every run and never kept in the
# repository (AGENTS.md: no binary files in the repo).

name: Android

on:
  push:
    branches: [main, android-app]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      N: ${{ github.run_number }}
      VITE_BUNDLE_VERSION: ${{ github.run_number }}
      CAP_TEST: ${{ github.ref == 'refs/heads/main' && '0' || '1' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm ci

      - name: The site's files
        run: npm run build

      # What only the website needs: the pages written out for search engines
      # (the app draws them itself), the service worker, the store pictures.
      - name: Only what the app needs
        run: rm -rf dist/el dist/en dist/screenshots dist/og-image.png dist/sitemap.xml dist/robots.txt dist/sw.js dist/workbox-*.js

      - name: The Android project
        run: npx cap add android

      - name: Icons and splash, from the app's own icon
        run: |
          node scripts/android-assets.mjs
          npx @capacitor/assets generate --android

      - name: Version
        run: |
          f=android/app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode $N/; s/versionName \"[^\"]*\"/versionName \"1.$N\"/" "$f"
          grep -q "versionCode $N" "$f"
          npx cap sync android

      # Every copy signed with the same key (the secret TEST_DEBUG_KEYSTORE, a
      # debug keystore as base64), so a new APK installs over the old one.
      # Without the secret, each run makes its own key, as before.
      - name: The same signing key every time
        env:
          KEYSTORE: ${{ secrets.TEST_DEBUG_KEYSTORE }}
        run: |
          [ -n "$KEYSTORE" ] || { echo "No TEST_DEBUG_KEYSTORE: a key of this run's own."; exit 0; }
          k="$RUNNER_TEMP/test.keystore"
          printf '%s' "$KEYSTORE" | tr -d ' \r\n' | base64 -d > "$k"
          keytool -list -v -keystore "$k" -storepass android -alias androiddebugkey | grep -m1 'SHA256:'
          echo "TEST_KEYSTORE_FILE=$k" >> "$GITHUB_ENV"

      # Gradle is told the key directly (it may not look in ~/.android).
      - name: APK
        working-directory: android
        run: |
          if [ -n "$TEST_KEYSTORE_FILE" ]; then
            ./gradlew assembleDebug --no-daemon \
              -Pandroid.injected.signing.store.file="$TEST_KEYSTORE_FILE" \
              -Pandroid.injected.signing.store.password=android \
              -Pandroid.injected.signing.key.alias=androiddebugkey \
              -Pandroid.injected.signing.key.password=android
          else
            ./gradlew assembleDebug --no-daemon
          fi

      # The package for Google Play (AAB), signed with the upload key: the
      # secrets UPLOAD_KEYSTORE (the keystore as base64), UPLOAD_KEYSTORE_PASSWORD,
      # UPLOAD_KEY_ALIAS and UPLOAD_KEY_PASSWORD (if it differs from the store's).
      # Same id as the app already on Play, so it goes in as a new version of
      # it. On a branch it is only built (with the test key), as a check.
      - name: The package for Google Play (AAB)
        working-directory: android
        env:
          UPLOAD_KEYSTORE: ${{ secrets.UPLOAD_KEYSTORE }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            [ -n "$UPLOAD_KEYSTORE" ] || { echo "No UPLOAD_KEYSTORE yet: no package for Google Play."; exit 0; }
            k="$RUNNER_TEMP/upload.keystore"
            printf '%s' "$UPLOAD_KEYSTORE" | tr -d ' \r\n' | base64 -d > "$k"
            sp="$UPLOAD_KEYSTORE_PASSWORD"; ka="$UPLOAD_KEY_ALIAS"; kp="${UPLOAD_KEY_PASSWORD:-$UPLOAD_KEYSTORE_PASSWORD}"
          else
            [ -n "$TEST_KEYSTORE_FILE" ] || { echo "No test key: no check build."; exit 0; }
            k="$TEST_KEYSTORE_FILE"; sp=android; ka=androiddebugkey; kp=android
          fi
          # Which key signs it (Play knows the upload key as 77:40:B0:4E:…:89:EA).
          keytool -list -v -keystore "$k" -storepass "$sp" -alias "$ka" | grep -m1 'SHA256:'
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$k" \
            -Pandroid.injected.signing.store.password="$sp" \
            -Pandroid.injected.signing.key.alias="$ka" \
            -Pandroid.injected.signing.key.password="$kp"
          f="$PWD/app/build/outputs/bundle/release/app-release.aab"
          ls -l "$f"
          unzip -l "$f" | grep -q 'base/assets/public/index.html'
          echo "AAB_FILE=$f" >> "$GITHUB_ENV"

      - name: Publish the package for Google Play (main only)
        if: github.ref == 'refs/heads/main' && env.AAB_FILE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$AAB_FILE" "mindfulness-play-$N.aab"
          gh release view play >/dev/null 2>&1 || gh release create play --prerelease --title "Android app: package for Google Play" --notes "The newest package (AAB) to upload in the Play Console, signed with the upload key. Made by the Android workflow from main." --latest=false
          gh release upload play "mindfulness-play-$N.aab" --clobber
          for old in $(gh release view play --json assets -q '.assets[].name' | grep -E '^mindfulness-play-[0-9]+\.aab$' | grep -v "^mindfulness-play-$N.aab$"); do
            gh release delete-asset play "$old" -y
          done

      - uses: actions/upload-artifact@v4
        with:
          name: mindfulness-android-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      # The test copy, to download straight onto a phone from the release page.
      - name: Publish the test APK (branches)
        if: github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk mindfulness-test.apk
          gh release view android-test >/dev/null 2>&1 || gh release create android-test --prerelease --title "Android app: test copy" --notes "A test copy of the Android app (its own id and name, next to the app from the store). Made by the Android workflow from the branch ${{ github.ref_name }}." --latest=false
          gh release upload android-test mindfulness-test.apk --clobber

      - name: Publish the update for installed apps (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && zip -qr "../app-bundle-$N.zip" .)
          sha=$(sha256sum "app-bundle-$N.zip" | cut -d' ' -f1)
          url="https://github.com/${{ github.repository }}/releases/download/app-bundle/app-bundle-$N.zip"
          printf '{"version":%s,"url":"%s","sha256":"%s","minNative":1}\n' "$N" "$url" "$sha" > app-bundle.json
          gh release view app-bundle >/dev/null 2>&1 || gh release create app-bundle --title "Android app: update bundle" --notes "The site's files for the Android app's own updates (src/lib/nativeUpdate.ts). Made by the Android workflow." --latest=false
          gh release upload app-bundle "app-bundle-$N.zip" --clobber
          gh release upload app-bundle app-bundle.json --clobber
          for old in $(gh release view app-bundle --json assets -q '.assets[].name' | grep -E '^app-bundle-[0-9]+\.zip$' | grep -v "^app-bundle-$N.zip$"); do
            gh release delete-asset app-bundle "$old" -y
          done
