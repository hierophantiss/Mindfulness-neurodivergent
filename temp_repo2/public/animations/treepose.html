<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tree Pose - Gravity Exercise</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #05080a;
            color: #bde0cf;
            font-family: 'Inter', system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        canvas {
            display: block;
            touch-action: none;
        }
        .controls {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            pointer-events: none;
        }
        .caption {
            background: rgba(0, 0, 0, 0.7);
            padding: 12px 24px;
            border-radius: 20px;
            font-size: 14px;
            display: inline-block;
            backdrop-blur: 10px;
            border: 1px solid rgba(140, 200, 170, 0.3);
            max-width: 80%;
            pointer-events: auto;
        }
        .hint {
            margin-top: 10px;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(140, 200, 170, 0.6);
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="controls">
        <div class="caption" id="caption">Νιώστε τη βαρύτητα. Βρείτε τον άξονά σας.</div>
        <div class="hint">Μετακινήστε το ποντίκι ή το δάχτυλο για να αλλάξετε την κλίση</div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const caption = document.getElementById('caption');

        let width, height;
        let mouseX = 0;
        let targetTilt = 0;
        let currentTilt = 0;
        let gravity = 0.05;
        let friction = 0.95;
        let velocity = 0;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * window.devicePixelRatio;
            canvas.height = height * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            mouseX = width / 2;
        }

        window.addEventListener('resize', resize);
        resize();

        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
        });

        window.addEventListener('touchmove', (e) => {
            mouseX = e.touches[0].clientX;
        });

        const strings = {
            el: ["Νιώστε τη βαρύτητα. Βρείτε τον άξονά σας.", "Η κλίση φέρνει ένταση. Επιστρέψτε στο κέντρο.", "Σταθερότητα σημαίνει αποδοχή της βαρύτητας."],
            en: ["Feel the gravity. Find your axis.", "Tilting brings tension. Return to the center.", "Stability means accepting gravity."]
        };

        const lang = window.location.search.includes('lang=en') ? 'en' : 'el';

        function animate() {
            ctx.fillStyle = '#05080a';
            ctx.fillRect(0, 0, width, height);

            // Draw axis
            ctx.beginPath();
            ctx.moveTo(width / 2, 50);
            ctx.lineTo(width / 2, height - 50);
            ctx.strokeStyle = 'rgba(140, 200, 170, 0.2)';
            ctx.setLineDash([5, 10]);
            ctx.stroke();
            ctx.setLineDash([]);

            // Physics
            targetTilt = (mouseX - width / 2) / (width / 2); // -1 to 1
            const diff = targetTilt - currentTilt;
            velocity += diff * 0.01;
            velocity *= friction;
            currentTilt += velocity;

            // Update caption based on tilt
            if (Math.abs(currentTilt) < 0.1) {
                caption.innerText = strings[lang][0];
                caption.style.borderColor = 'rgba(140, 200, 170, 0.3)';
            } else if (Math.abs(currentTilt) < 0.5) {
                caption.innerText = strings[lang][1];
                caption.style.borderColor = 'rgba(255, 200, 100, 0.3)';
            } else {
                caption.innerText = strings[lang][2];
                caption.style.borderColor = 'rgba(255, 100, 100, 0.3)';
            }

            // Draw figure
            ctx.save();
            ctx.translate(width / 2, height - 100);
            ctx.rotate(currentTilt * 0.2);

            // Body
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(0, -200);
            ctx.strokeStyle = '#bde0cf';
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.stroke();

            // Head
            ctx.beginPath();
            ctx.arc(0, -230, 20, 0, Math.PI * 2);
            ctx.fillStyle = '#bde0cf';
            ctx.fill();

            // Grounding point
            ctx.beginPath();
            ctx.arc(0, 0, 10, 0, Math.PI * 2);
            ctx.fillStyle = '#7fc1a3';
            ctx.fill();

            // Energy line
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(0, -height);
            ctx.strokeStyle = 'rgba(127, 193, 163, 0.1)';
            ctx.stroke();

            ctx.restore();

            // Ground
            ctx.beginPath();
            ctx.moveTo(width / 2 - 100, height - 100);
            ctx.lineTo(width / 2 + 100, height - 100);
            ctx.strokeStyle = 'rgba(127, 193, 163, 0.5)';
            ctx.stroke();

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
