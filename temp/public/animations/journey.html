<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Journey</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #05080a;
            color: #bde0cf;
            font-family: 'Inter', system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        canvas {
            display: block;
        }
        .controls {
            position: absolute;
            bottom: 40px;
            width: 100%;
            text-align: center;
        }
        .caption {
            background: rgba(0, 0, 0, 0.7);
            padding: 12px 24px;
            border-radius: 20px;
            font-size: 14px;
            backdrop-blur: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 80%;
            display: inline-block;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="controls">
        <div class="caption" id="caption">Το Ταξίδι συνεχίζεται. Κάθε στιγμή είναι μια νέα αρχή.</div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const caption = document.getElementById('caption');

        let width, height;
        let particles = [];

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * window.devicePixelRatio;
            canvas.height = height * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            initParticles();
        }

        function initParticles() {
            particles = [];
            for(let i=0; i<150; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    z: Math.random() * width,
                    o: 0.1 + Math.random() * 0.5
                });
            }
        }

        window.addEventListener('resize', resize);
        resize();

        const lang = window.location.search.includes('lang=en') ? 'en' : 'el';
        const strings = {
            el: "Το Ταξίδι: Η διαρκής ροή της επίγνωσης.",
            en: "The Journey: The continuous flow of awareness."
        };
        caption.innerText = strings[lang];

        function animate() {
            ctx.fillStyle = '#05080a';
            ctx.fillRect(0, 0, width, height);

            const cx = width / 2;
            const cy = height / 2;

            particles.forEach(p => {
                p.z -= 2;
                if(p.z <= 0) p.z = width;

                const k = 128 / p.z;
                const px = p.x * k + cx;
                const py = p.y * k + cy;

                if(px >= 0 && px <= width && py >= 0 && py <= height) {
                    const size = (1 - p.z / width) * 5;
                    ctx.beginPath();
                    ctx.arc(px, py, size, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(189, 224, 207, ${p.o})`;
                    ctx.fill();
                }
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
